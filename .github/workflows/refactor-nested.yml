name: Safe Nested Conditional Refactoring

on:
  push:
    paths:
      - scripts/flatten-nested-conditionals.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Preview AST-safe flattening
        run: bun scripts/flatten-nested-conditionals.ts --apply --guarded-returns-only
      - name: Check Core and Layers TypeScript after refactoring
        run: bun x tsc --noEmit --pretty false --project tfjs-layers/tsconfig.json
      - name: Check WebGL TypeScript after refactoring
        run: bun x tsc --noEmit --pretty false --project tfjs-backend-webgl/tsconfig.json
      - name: Verify changed-file formatting
        run: git diff --check
      - name: Check source policy
        run: bun run check:source-policy
      - name: Install pinned Code Guards
        working-directory: vendor/code-guards
        run: bun install --ignore-scripts
      - name: Build Code Guards
        working-directory: vendor/code-guards
        run: bun run build
      - name: Measure remaining nested conditionals
        run: |
          bun vendor/code-guards/dist/src/cli.js no-nested-if --project tsconfig.code-guards.json --format json > remaining-nested-conditions.json
          bun -e 'const fs=require("fs"); const issues=JSON.parse(fs.readFileSync("remaining-nested-conditions.json","utf8")); console.log("Remaining CG001 findings:",issues.length); if(issues.length>=744) process.exit(1);'
      - name: Create reviewed patch
        run: git diff --binary > nested-conditional-refactor.patch
      - uses: actions/upload-artifact@v4
        with:
          name: nested-conditional-refactor-preview
          path: nested-conditional-refactor.patch
          if-no-files-found: error

