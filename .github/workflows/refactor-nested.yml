name: Safe Nested Conditional Refactoring

on:
  push:
    paths:
      - scripts/flatten-nested-conditionals.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Preview AST-safe flattening
        run: bun scripts/flatten-nested-conditionals.ts --apply
      - name: Verify changed-file formatting
        run: git diff --check
      - name: Create reviewed patch
        run: git diff --binary > nested-conditional-refactor.patch
      - uses: actions/upload-artifact@v4
        with:
          name: nested-conditional-refactor-preview
          path: nested-conditional-refactor.patch
          if-no-files-found: error
