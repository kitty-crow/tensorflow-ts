name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-guards:
    name: Strict nested conditionals (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install TensorFlow TypeScript dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned Code Guards dependencies with Bun
        working-directory: vendor/code-guards
        run: bun install --ignore-scripts

      - name: Build pinned Code Guards with Bun
        working-directory: vendor/code-guards
        run: bun run build

      - name: Check TensorFlow source policy with Bun
        run: bun run check:source-policy

      - name: Collect nested conditional inventory
        run: |
          set +e
          bun run guards:nested --format json --progress > nested-conditions.json
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          bun scripts/summarise-nested-conditions.ts nested-conditions.json

      - name: Upload complete nested conditional inventory
        uses: actions/upload-artifact@v4
        with:
          name: nested-conditional-inventory
          path: nested-conditions.json
          if-no-files-found: error

      - name: Strict nested conditional scan with Bun
        run: bun run guards:nested --format github --progress
