name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-guards:
    name: Strict full Code Guards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install TensorFlow dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Install pinned Code Guards
        run: npm install --prefix vendor/code-guards --no-audit --no-fund

      - name: Build pinned Code Guards
        run: npm run build --prefix vendor/code-guards

      - name: Check TensorFlow source policy
        run: npm run check:source-policy

      - name: Strict full source and test scan
        run: npm run guards:strict -- --format github
