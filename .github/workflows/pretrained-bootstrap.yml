name: Pretrained runtime bootstrap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare cached CPU runtime from clean checkout
        run: node scripts/prepare_pretrained_runtime.mjs
      - name: Execute pretrained GraphModel through cached runtime
        run: node link-package/pretrained_smoke.mjs
      - name: Execute pretrained LayersModel through cached runtime
        run: node link-package/layers_pretrained_smoke.mjs
      - name: Execute photographic-person worker end to end
        run: node scripts/avatar_photo_smoke.mjs
