name: Validate Keras loss_weights

on:
  push:
    branches:
      - feature/keras-loss-weights
    paths:
      - .github/workflows/validate-keras-loss-weights.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keras-loss-weights

      - name: Install repository dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Typecheck tfjs-layers
        run: yarn tsc --noEmit -p tfjs-layers/tsconfig.json

      - name: Bundle direct source runtime smoke
        run: |
          test -x node_modules/.bin/esbuild
          node_modules/.bin/esbuild .github/scripts/loss_weights_runtime_smoke.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node20 \
            --tree-shaking=false \
            --alias:@tensorflow/tfjs-core="$PWD/tfjs-core/src/index.ts" \
            --alias:@tensorflow/tfjs-core/dist="$PWD/tfjs-core/src" \
            --alias:@tensorflow/tfjs-backend-cpu="$PWD/tfjs-backend-cpu/src/index.ts" \
            --alias:@tensorflow/tfjs-backend-cpu/dist="$PWD/tfjs-backend-cpu/src" \
            --outfile=/tmp/loss-weights-runtime-smoke.cjs

      - name: Run direct source runtime smoke
        run: node /tmp/loss-weights-runtime-smoke.cjs
